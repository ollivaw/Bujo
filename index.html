<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuJo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='0 0 256 256'><rect width='256' height='256' rx='60' fill='%230b0c0e'/><text x='128' y='170' font-size='150' text-anchor='middle'>📓</text></svg>">

  <style>
    :root {
      --bg-color: #0b0c0e;
      --text-color: #e2e8f0;
      --accent-color: #f4b8e4; /* Rosa pastel 🩷 */
      --muted-color: #64748b;
      --panel-bg: #16181d;
      --dot-color: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Ocultar barra de scroll */
    ::-webkit-scrollbar { display: none; }
    html { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(var(--dot-color) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    .container {
      flex: 1;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 20px 80px 20px;
    }
    .header-date {
      color: var(--accent-color);
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-transform: capitalize;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
      font-size: 19px;
      line-height: 1.4;
      width: 100%;
    }
    .checkbox {
      user-select: none;
      cursor: pointer;
      padding-right: 8px;
      font-weight: bold;
      color: var(--accent-color);
      flex-shrink: 0;
      line-height: 1.4;
    }
    .item-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-size: 19px;
      font-family: inherit;
      line-height: 1.4;
      width: 100%;
      word-break: break-word;
      white-space: pre-wrap;
      resize: none;
      overflow: hidden;
    }
    .item-input.done {
      text-decoration: line-through;
      color: var(--muted-color);
    }
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px;
      font-size: 13px;
      text-align: center;
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-date" id="current-date"></div>
    <div id="editor-container"></div>
  </div>

  <div class="timer-bar" id="timer">Expira en 0h 0m (2:00 AM)</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const container = document.getElementById('editor-container');
    const timerDisplay = document.getElementById('timer');
    const dateDisplay = document.getElementById('current-date');

    let items = [];

    function displayDate() {
      const now = new Date();
      const weekday = now.toLocaleDateString('es-ES', { weekday: 'long' });
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      
      dateDisplay.textContent = `${weekday.charAt(0).toUpperCase() + weekday.slice(1)}, ${day}/${month}/${year}`;
    }

    function checkExpiration() {
      const lastReset = localStorage.getItem('bujo_last_reset');
      const now = new Date();
      const prevReset = new Date();
      if (now.getHours() < 2) prevReset.setDate(prevReset.getDate() - 1);
      prevReset.setHours(2, 0, 0, 0);

      if (!lastReset || parseInt(lastReset) < prevReset.getTime()) {
        items = [{ type: 'task', text: '', done: false }];
        localStorage.setItem('bujo_last_reset', now.getTime().toString());
        saveItems();
        displayDate();
        render();
      }
    }

    function saveItems() {
      localStorage.setItem('bujo_items', JSON.stringify(items));
    }

    function loadItems() {
      const stored = localStorage.getItem('bujo_items');
      if (stored) {
        try { items = JSON.parse(stored); } catch(e) { items = []; }
      }
      if (!items || items.length === 0) {
        items = [{ type: 'task', text: '', done: false }];
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function render() {
      container.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'list-item';

        if (item.type === 'task') {
          const box = document.createElement('span');
          box.className = 'checkbox';
          box.textContent = item.done ? '[x]' : '[ ]';
          box.onclick = () => toggleTask(index);
          row.appendChild(box);
        }

        const input = document.createElement('textarea');
        input.rows = 1;
        input.className = 'item-input' + (item.done ? ' done' : '');
        input.value = item.text;
        
        input.oninput = (e) => {
          autoResize(e.target);
          items[index].text = e.target.value;

          if (items[index].type === 'note' && (e.target.value.startsWith('- ') || e.target.value.startsWith('-['))) {
            items[index].type = 'task';
            items[index].text = e.target.value.replace(/^-\s?\[?\s?\]?/, '').trimStart();
            render();
            focusInput(index);
            return;
          }
          saveItems();
        };

        input.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (item.text.trim() === '' && item.type === 'task') {
              items[index].type = 'note';
              render();
              focusInput(index);
            } else {
              items.splice(index + 1, 0, { type: 'task', text: '', done: false });
              render();
              focusInput(index + 1);
            }
            saveItems();
          } else if (e.key === 'Backspace' && item.text === '' && items.length > 1) {
            e.preventDefault();
            items.splice(index, 1);
            render();
            focusInput(Math.max(0, index - 1));
            saveItems();
          }
        };

        row.appendChild(input);
        container.appendChild(row);
        autoResize(input);
      });
    }

    function focusInput(index) {
      setTimeout(() => {
        const inputs = container.querySelectorAll('.item-input');
        if (inputs[index]) {
          inputs[index].focus();
          inputs[index].selectionStart = inputs[index].value.length;
          inputs[index].selectionEnd = inputs[index].value.length;
        }
      }, 10);
    }

    function toggleTask(index) {
      items[index].done = !items[index].done;
      saveItems();
      render();
    }

    function updateTimer() {
      checkExpiration(); // Verifica automáticamente si ya pasaron las 2 AM

      const now = new Date();
      const reset = new Date();
      reset.setHours(2, 0, 0, 0);
      if (now >= reset) reset.setDate(reset.getDate() + 1);
      
      const diffMs = reset - now;
      const hours = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      timerDisplay.textContent = `Expira en ${hours}h ${mins}m (2:00 AM)`;
    }

    // Revisa también cuando la pantalla se vuelve a encender o abres la app
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkExpiration();
        displayDate();
        updateTimer();
      }
    });

    displayDate();
    checkExpiration();
    loadItems();
    render();
    updateTimer();
    setInterval(updateTimer, 30000); // Revisa cada 30 segundos
  </script>
</body>
</html>
